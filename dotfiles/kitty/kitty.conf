font_family Jet Brains Mono Semi Bold
font_size 12

# background_opacity 0.99
confirm_os_window_close 0

enable_audio_bell no
background_opacity 0.8


# Performance
repaint_delay 10
input_delay 0
sync_to_monitor yes

